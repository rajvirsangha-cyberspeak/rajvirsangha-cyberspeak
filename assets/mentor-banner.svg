<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="340">
    <stop stop-color="#050B14"/>
    <stop offset="0.55" stop-color="#0B1220"/>
    <stop offset="1" stop-color="#071A1F"/>
  </linearGradient>
  <linearGradient id="line" x1="120" y1="0" x2="1080" y2="0">
    <stop stop-color="#14B8A6" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#2DD4BF"/>
    <stop offset="1" stop-color="#14B8A6" stop-opacity="0"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect width="1200" height="340" rx="28" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="338" rx="27" stroke="#1E293B"/>

<g opacity="0.35">
  <path d="M0 70H1200M0 140H1200M0 210H1200M0 280H1200" stroke="#1F2937"/>
  <path d="M120 0V340M240 0V340M360 0V340M480 0V340M600 0V340M720 0V340M840 0V340M960 0V340M1080 0V340" stroke="#111827"/>
</g>

<g filter="url(#glow)">
  <circle cx="140" cy="82" r="4" fill="#2DD4BF">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1045" cy="248" r="4" fill="#2DD4BF">
    <animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/>
  </circle>
</g>

<path d="M90 276C260 220 350 300 520 244C690 188 790 272 1110 214" stroke="url(#line)" stroke-width="2">
  <animate attributeName="stroke-dasharray" values="0 1400;700 700;0 1400" dur="5s" repeatCount="indefinite"/>
</path>

<text x="600" y="116" text-anchor="middle" fill="#E5E7EB" font-size="44" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="5">RAJVIR SANGHA</text>
<text x="600" y="161" text-anchor="middle" fill="#2DD4BF" font-size="19" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="3">CYBERSECURITY MENTOR · CISSP</text>
<text x="600" y="209" text-anchor="middle" fill="#94A3B8" font-size="22" font-family="Arial, Helvetica, sans-serif">I help aspiring cyber professionals turn learning into proof.</text>

<g opacity="0.95">
  <rect x="359" y="244" width="482" height="42" rx="21" fill="#0F172A" stroke="#164E63"/>
  <text x="600" y="271" text-anchor="middle" fill="#CCFBF1" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="1.4">BUILD · INVESTIGATE · DOCUMENT · EXPLAIN</text>
</g>

<rect x="-250" y="0" width="170" height="340" fill="#2DD4BF" opacity="0.05" transform="skewX(-18)">
  <animate attributeName="x" from="-250" to="1450" dur="6s" repeatCount="indefinite"/>
</rect>
</svg>